<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tare.tools — Graph Backlog Visualizer</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --done: #238636;
      --partial: #d29922;
      --not-done: #8957e5;
      --superseded: #484f58;
      --blocked: #da3633;
      --ready: #2ea043;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title span.badge {
      font-size: 12px;
      background: #1f6feb22;
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #1f6feb44;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, select, button {
      background: var(--bg);
      color: var(--text-bright);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      cursor: pointer;
      background: #21262d;
      transition: background 0.15s;
    }
    button:hover {
      background: #30363d;
    }
    button.primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }
    button.primary:hover {
      background: #2ea043;
    }
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .graph-panel {
      flex: 1;
      position: relative;
      background: radial-gradient(circle, #161b22 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .clusters-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .cluster-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cluster-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .cluster-header .count {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 12px;
    }
    .nodes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .node-item {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .node-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .node-item.selected {
      border-color: var(--accent);
      background: #1f6feb15;
    }
    .node-item.ready-frontier {
      border-left: 4px solid var(--ready);
    }
    .node-item.blocked-node {
      border-left: 4px solid var(--blocked);
    }
    .node-item.done-node {
      border-left: 4px solid var(--done);
      opacity: 0.75;
    }
    .node-item.partial-node {
      border-left: 4px solid var(--partial);
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .node-id {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright);
      font-family: monospace;
    }
    .node-tags {
      display: flex;
      gap: 4px;
    }
    .tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text-muted);
    }
    .node-title {
      font-size: 13px;
      margin-top: 4px;
      color: var(--text);
      line-height: 1.35;
    }
    .inspector-panel {
      width: 420px;
      background: var(--card-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
    }
    .inspector-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
    }
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .detail-content {
      font-size: 13px;
      line-height: 1.45;
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-list li {
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #161b22;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .stats-item span {
      font-weight: 600;
      color: var(--text-bright);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span>tare.tools</span>
      <span class="badge">Graph Backlog</span>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search tasks, IDs, tags..." style="width: 220px;">
      <select id="statusFilter">
        <option value="ALL">All Statuses</option>
        <option value="FRONTIER">Ready Frontier (Actionable)</option>
        <option value="NOT_DONE">NOT_DONE</option>
        <option value="PARTIAL">PARTIAL</option>
        <option value="DONE">DONE</option>
        <option value="SUPERSEDED">SUPERSEDED</option>
      </select>
      <select id="clusterFilter">
        <option value="ALL">All Clusters</option>
      </select>
      <button id="resetFiltersBtn">Reset</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="graph-panel" id="graphContainer">
      <div class="clusters-container" id="clustersGrid"></div>
    </div>
    <div class="inspector-panel" id="inspectorPanel">
      <div class="inspector-title" id="inspectorTitle">Select a task</div>
      <div class="detail-section">
        <div class="detail-label">Status & Readiness</div>
        <div class="detail-content" id="inspectorStatus">No item selected.</div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Summary</div>
        <div class="detail-content" id="inspectorSummary">-</div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Exit Criteria / DoD</div>
        <div class="detail-content" id="inspectorExitCriteria">-</div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Upstream Blockers / Prerequisites</div>
        <ul class="detail-list" id="inspectorPrereqs"><li>None</li></ul>
      </div>
      <div class="detail-section">
        <div class="detail-label">Downstream Dependents</div>
        <ul class="detail-list" id="inspectorDownstream"><li>None</li></ul>
      </div>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stats-item">Total Tasks: <span id="statTotal">0</span></div>
    <div class="stats-item">Frontier Ready: <span id="statReady">0</span></div>
    <div class="stats-item">Done: <span id="statDone">0</span></div>
    <div class="stats-item">Edges: <span id="statEdges">0</span></div>
  </div>

  <script>
    const GRAPH_DATA = {"edges": [{"confidence": {"score": 1.0}, "from": "TASK-01", "notes": ["API requires Database"], "requirements": {}, "semantic": true, "source_details": [], "source_refs": ["SRC-INIT"], "to": "TASK-02", "type": "UNLOCKS"}, {"confidence": {"score": 1.0}, "from": "TASK-02", "notes": ["Frontend requires API"], "requirements": {}, "semantic": true, "source_details": [], "source_refs": ["SRC-INIT"], "to": "TASK-03", "type": "UNLOCKS"}], "meta": {"generated_at": "2026-08-15T12:00:00Z", "projection_run_id": "proj-sample-001", "schema": "work-graph-poc/0.5", "snapshot": "2026-08-15-v1", "title": "Sample Project Backlog"}, "nodes": [{"admission_state": "ADMITTED", "authority_required": "none", "bounded_contexts": ["storage", "data"], "canonical_id": "TASK-01", "canonical_revision": "r1", "canonical_system": "local", "cluster": "infrastructure", "completion": {"dod_satisfied": true, "evidence_grade": "A", "materialization_scope": "local", "status": "DONE"}, "confidence": {"score": 1.0}, "criticality": "CRITICAL", "epistemic_status": "CERTAIN", "evidence_required": ["test_logs"], "exit_criteria": ["All schemas validated", "Unit tests passing"], "horizon": "H0", "id": "TASK-01", "items": [], "kind": "task", "metrics": {}, "notes": [], "observed_at": "2026-08-15T12:00:00Z", "priority": "P0", "projection_run_id": "proj-sample-001", "provenance": ["SRC-INIT"], "readiness": {"operational_identity_required": true}, "source_claim_ids": ["SRC-INIT:claim-1"], "source_details": [], "source_refs": ["SRC-INIT"], "staleness_state": "FRESH", "summary": "Implement relational models and automated migrations.", "tags": ["db", "backend"], "title": "Set up Database & Storage Models", "unlock_score": 10, "work_status": "PROPOSED"}, {"admission_state": "ADMITTED", "authority_required": "none", "bounded_contexts": ["api", "service"], "canonical_id": "TASK-02", "canonical_revision": "r1", "canonical_system": "local", "cluster": "api", "completion": {"dod_satisfied": false, "evidence_grade": "B", "materialization_scope": "local", "status": "NOT_DONE"}, "confidence": {"score": 0.95}, "criticality": "HIGH", "epistemic_status": "CERTAIN", "evidence_required": ["api_integration_tests"], "exit_criteria": ["Endpoints return 200 OK", "Contract tests pass"], "horizon": "H0", "id": "TASK-02", "items": [], "kind": "task", "metrics": {}, "notes": [], "observed_at": "2026-08-15T12:00:00Z", "priority": "P0", "projection_run_id": "proj-sample-001", "provenance": ["SRC-INIT"], "readiness": {"operational_identity_required": true}, "source_claim_ids": ["SRC-INIT:claim-2"], "source_details": [], "source_refs": ["SRC-INIT"], "staleness_state": "FRESH", "summary": "Develop REST/GraphQL endpoints for core business domain.", "tags": ["api", "backend"], "title": "Build Core Business API", "unlock_score": 8, "work_status": "PROPOSED"}, {"admission_state": "ADMITTED", "authority_required": "none", "bounded_contexts": ["frontend", "ui"], "canonical_id": "TASK-03", "canonical_revision": "r1", "canonical_system": "local", "cluster": "frontend", "completion": {"dod_satisfied": false, "evidence_grade": "B", "materialization_scope": "local", "status": "NOT_DONE"}, "confidence": {"score": 0.9}, "criticality": "MEDIUM", "epistemic_status": "CERTAIN", "evidence_required": ["ui_tests"], "exit_criteria": ["UI renders correctly", "End-to-end tests pass"], "horizon": "H1", "id": "TASK-03", "items": [], "kind": "task", "metrics": {}, "notes": [], "observed_at": "2026-08-15T12:00:00Z", "priority": "P1", "projection_run_id": "proj-sample-001", "provenance": ["SRC-INIT"], "readiness": {"operational_identity_required": true}, "source_claim_ids": ["SRC-INIT:claim-3"], "source_details": [], "source_refs": ["SRC-INIT"], "staleness_state": "FRESH", "summary": "Develop client dashboard consuming the Core API.", "tags": ["frontend", "ui"], "title": "Create User Interface Dashboard", "unlock_score": 5, "work_status": "PROPOSED"}], "sources": {"SRC-INIT": {"kind": "architecture_decision", "locator": "docs/architecture.md", "recoverability": "CONTENT_ADDRESSED", "title": "Initial Architecture Spec"}}};
    
    let selectedNodeId = null;
    const nodes = GRAPH_DATA.nodes || [];
    const edges = GRAPH_DATA.edges || [];
    const byId = {};
    nodes.forEach(n => byId[n.id] = n);

    // Build cluster options
    const clusters = [...new Set(nodes.map(n => n.cluster || 'general'))].sort();
    const clusterSelect = document.getElementById('clusterFilter');
    clusters.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      clusterSelect.appendChild(opt);
    });

    function getStatus(n) {
      return (n.completion && n.completion.status) || 'NOT_DONE';
    }

    function isReady(n) {
      const st = getStatus(n);
      if (st === 'DONE' || st === 'SUPERSEDED') return false;
      const blockers = (edges || []).filter(e => e.to === n.id && (e.semantic !== false));
      for (const b of blockers) {
        const src = byId[b.from];
        if (!src || getStatus(src) !== 'DONE') return false;
      }
      return true;
    }

    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusF = document.getElementById('statusFilter').value;
      const clusterF = document.getElementById('clusterFilter').value;

      const grid = document.getElementById('clustersGrid');
      grid.innerHTML = '';

      let readyCount = 0;
      let doneCount = 0;

      const grouped = {};
      clusters.forEach(c => grouped[c] = []);

      nodes.forEach(n => {
        const st = getStatus(n);
        const ready = isReady(n);
        if (ready) readyCount++;
        if (st === 'DONE') doneCount++;

        // Filter
        if (statusF === 'FRONTIER' && !ready) return;
        if (statusF !== 'ALL' && statusF !== 'FRONTIER' && st !== statusF) return;
        if (clusterF !== 'ALL' && (n.cluster || 'general') !== clusterF) return;
        if (search) {
          const text = (n.id + ' ' + (n.title || '') + ' ' + (n.summary || '') + ' ' + (n.tags || []).join(' ')).toLowerCase();
          if (!text.includes(search)) return;
        }

        const cl = n.cluster || 'general';
        if (!grouped[cl]) grouped[cl] = [];
        grouped[cl].push(n);
      });

      document.getElementById('statTotal').textContent = nodes.length;
      document.getElementById('statReady').textContent = readyCount;
      document.getElementById('statDone').textContent = doneCount;
      document.getElementById('statEdges').textContent = edges.length;

      Object.keys(grouped).sort().forEach(cl => {
        const list = grouped[cl];
        if (list.length === 0) return;

        const card = document.createElement('div');
        card.className = 'cluster-card';

        const head = document.createElement('div');
        head.className = 'cluster-header';
        head.innerHTML = `<span>${cl}</span><span class="count">${list.length} tasks</span>`;
        card.appendChild(head);

        const listDiv = document.createElement('div');
        listDiv.className = 'nodes-list';

        list.forEach(n => {
          const st = getStatus(n);
          const ready = isReady(n);
          const item = document.createElement('div');
          let classState = 'blocked-node';
          if (st === 'DONE') classState = 'done-node';
          else if (st === 'PARTIAL') classState = 'partial-node';
          else if (ready) classState = 'ready-frontier';

          item.className = `node-item ${classState} ${n.id === selectedNodeId ? 'selected' : ''}`;
          item.onclick = () => selectNode(n.id);

          item.innerHTML = `
            <div class="node-header">
              <span class="node-id">${n.id}</span>
              <div class="node-tags">
                <span class="tag">${n.priority || 'P1'}</span>
                <span class="tag">${st}</span>
              </div>
            </div>
            <div class="node-title">${n.title || ''}</div>
          `;
          listDiv.appendChild(item);
        });

        card.appendChild(listDiv);
        grid.appendChild(card);
      });
    }

    function selectNode(id) {
      selectedNodeId = id;
      const n = byId[id];
      if (!n) return;

      document.getElementById('inspectorTitle').textContent = `${n.id}: ${n.title || ''}`;
      const st = getStatus(n);
      const ready = isReady(n);
      document.getElementById('inspectorStatus').innerHTML = `
        <strong>Status:</strong> ${st} | <strong>Readiness:</strong> ${ready ? '<span style="color:var(--ready)">READY (Frontier)</span>' : '<span style="color:var(--blocked)">BLOCKED</span>'}<br>
        <strong>Priority:</strong> ${n.priority || 'P1'} | <strong>Horizon:</strong> ${n.horizon || 'H1'} | <strong>Criticality:</strong> ${n.criticality || 'MEDIUM'}
      `;
      document.getElementById('inspectorSummary').textContent = n.summary || 'No summary provided.';
      
      const ec = n.exit_criteria || [];
      document.getElementById('inspectorExitCriteria').innerHTML = ec.length > 0
        ? ec.map(x => `<div>• ${x}</div>`).join('')
        : '<em>Standard completion criteria.</em>';

      // Prereqs
      const prereqs = edges.filter(e => e.to === id);
      const prList = document.getElementById('inspectorPrereqs');
      prList.innerHTML = prereqs.length > 0
        ? prereqs.map(e => {
            const pNode = byId[e.from];
            const pSt = pNode ? getStatus(pNode) : 'UNKNOWN';
            return `<li onclick="selectNode('${e.from}')" style="cursor:pointer;"><strong>${e.from}</strong> [${pSt}] <span>${e.type}</span></li>`;
          }).join('')
        : '<li>No upstream blockers.</li>';

      // Downstream
      const downstream = edges.filter(e => e.from === id);
      const dsList = document.getElementById('inspectorDownstream');
      dsList.innerHTML = downstream.length > 0
        ? downstream.map(e => {
            const dNode = byId[e.to];
            const dSt = dNode ? getStatus(dNode) : 'UNKNOWN';
            return `<li onclick="selectNode('${e.to}')" style="cursor:pointer;"><strong>${e.to}</strong> [${dSt}] <span>${e.type}</span></li>`;
          }).join('')
        : '<li>No downstream dependents.</li>';

      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('clusterFilter').addEventListener('change', render);
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = 'ALL';
      document.getElementById('clusterFilter').value = 'ALL';
      render();
    });

    render();
    if (nodes.length > 0) selectNode(nodes[0].id);
  </script>
</body>
</html>
